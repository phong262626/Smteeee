<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SMTE Emergency Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Sarabun', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
        }
        .listening-pulse { animation: pulse-red 1.5s infinite; }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .teleprompter-text {
            text-shadow: 0 4px 8px rgba(0,0,0,0.8);
            line-height: 1.4;
            word-break: break-word;
        }
    </style>
</head>
<body class="bg-black text-white h-screen flex flex-col overflow-hidden select-none">

    <div id="key-modal" class="hidden fixed inset-0 bg-black/90 z-[100] flex flex-col items-center justify-center p-6">
        <h2 class="text-xl font-bold text-yellow-400 mb-4">🚨 เปลี่ยน API KEY ฉุกเฉิน</h2>
        <p class="text-gray-400 text-sm mb-2 text-center">ถ้า AI ไม่ตอบ แสดงว่า Key เก่าหมดอายุ<br>ให้เอา Key ใหม่มากรอกตรงนี้</p>
        <input type="text" id="new-key-input" placeholder="วาง API Key ใหม่ที่นี่ (AIza...)" class="w-full max-w-md p-4 bg-gray-800 border border-gray-600 rounded text-white mb-4 focus:outline-none focus:border-blue-500">
        <div class="flex gap-4">
            <button onclick="closeKeyModal()" class="px-6 py-2 border border-gray-600 rounded text-gray-400">ยกเลิก</button>
            <button onclick="saveNewKey()" class="px-6 py-2 bg-blue-600 rounded text-white font-bold">บันทึก & ใช้งาน</button>
        </div>
    </div>

    <header class="h-12 flex justify-between items-center px-4 bg-black/50 backdrop-blur-sm z-30 fixed top-0 w-full">
        <div class="text-xs text-gray-500 flex gap-2 items-center">
            <span id="status-dot" class="w-2 h-2 rounded-full bg-green-500"></span>
            <span id="model-status">Ready</span>
        </div>
        <div class="flex gap-2">
            <button onclick="openKeyModal()" class="text-yellow-500 text-[10px] border border-yellow-700/50 px-2 py-1 rounded bg-yellow-900/20">🔑 เปลี่ยน Key</button>
            <button onclick="clearScreen()" class="text-gray-400 text-xs border border-gray-700 px-3 py-1 rounded hover:bg-gray-800">Clear</button>
        </div>
    </header>

    <main class="h-[65vh] flex flex-col items-center justify-start pt-16 px-6 overflow-y-auto no-scrollbar relative w-full">
        <div id="ai-response-box" class="w-full text-center pb-10">
            <div class="text-gray-600 text-xl font-light opacity-50 italic mt-20">
                (แตะไมค์ แล้วพูดคำถาม...)
            </div>
        </div>
    </main>

    <footer class="h-[35vh] bg-gradient-to-t from-gray-900 via-gray-900 to-transparent flex flex-col justify-end pb-8 fixed bottom-0 w-full z-50">
        <div id="transcript-text" class="text-sm text-blue-400 text-center mb-4 h-6 px-4 truncate font-mono">...</div>

        <div class="flex items-center justify-center gap-6">
            <button id="mic-btn" onclick="toggleMic()" class="w-20 h-20 rounded-full bg-gray-800 border-2 border-gray-600 text-white shadow-lg flex items-center justify-center transition-all active:scale-90 hover:bg-gray-700">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
            </button>
            <button onclick="sendToAI()" class="w-20 h-20 rounded-full bg-blue-600 text-white shadow-lg flex items-center justify-center transition-all active:scale-90 hover:bg-blue-500 font-bold text-xl">
                GO
            </button>
        </div>
        <div class="text-[10px] text-gray-600 text-center mt-2">Emergency Mode: Change Key Available</div>
    </footer>

    <script>
        // --- 1. ระบบจัดการ KEY (สำคัญที่สุด) ---
        // ใช้ Key ที่ Save ไว้ในเครื่องก่อน ถ้าไม่มีใช้ Key สำรองนี้
        let CURRENT_KEY = localStorage.getItem('smte_api_key') || "AIzaSyCJ3KpW0Q64QyZefx8CA70VuAFJ1kIkxik"; 

        function openKeyModal() {
            document.getElementById('key-modal').classList.remove('hidden');
            document.getElementById('new-key-input').value = CURRENT_KEY;
        }

        function closeKeyModal() {
            document.getElementById('key-modal').classList.add('hidden');
        }

        function saveNewKey() {
            const newKey = document.getElementById('new-key-input').value.trim();
            if(newKey.length > 10) {
                CURRENT_KEY = newKey;
                localStorage.setItem('smte_api_key', newKey); // บันทึกลงเครื่องถาวร
                alert("บันทึก Key ใหม่แล้ว! ลองกด GO อีกครั้ง");
                closeKeyModal();
            } else {
                alert("Key ดูสั้นเกินไป ลองตรวจสอบความถูกต้อง");
            }
        }

        // --- 2. AI LOGIC (แสดง Error จริง) ---
        const BACKUP_MODELS = ["gemini-1.5-flash", "gemini-1.5-pro", "gemini-1.0-pro"];

        async function fetchAI(prompt, modelIndex = 0) {
            if (modelIndex >= BACKUP_MODELS.length) throw new Error("All Models Failed");

            const currentModel = BACKUP_MODELS[modelIndex];
            document.getElementById('model-status').innerText = `Try: ${currentModel}`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${currentModel}:generateContent?key=${CURRENT_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const data = await response.json();

                // *** เช็ค Error จาก Google โดยตรง ***
                if (data.error) {
                    console.error("Google Error:", data.error);
                    // ถ้าเป็น 404 (Not Found) หรือ 429 (Resource Exhausted) ให้ลองตัวถัดไป
                    if(data.error.code === 404 || data.error.code === 429) {
                        return await fetchAI(prompt, modelIndex + 1);
                    }
                    throw new Error(data.error.message); // Error อื่นๆ โยนออกมาเลย
                }

                if (!data.candidates || !data.candidates[0]) throw new Error("No response content");
                
                return data.candidates[0].content.parts[0].text;

            } catch (err) {
                console.warn(`${currentModel} Failed:`, err);
                if (modelIndex + 1 < BACKUP_MODELS.length) {
                    return await fetchAI(prompt, modelIndex + 1);
                } else {
                    throw err; // ถ้าหมดหนทางแล้ว ให้โยน Error ตัวล่าสุดออกมา
                }
            }
        }

        async function sendToAI() {
            const text = document.getElementById('transcript-text').innerText;
            const aiBox = document.getElementById('ai-response-box');

            if (!text || text.length < 2 || text.includes('กำลังฟัง')) return;

            aiBox.innerHTML = `<div class="mt-10 text-3xl font-bold text-yellow-400 animate-pulse">...กำลังคิด...</div>`;

            const prompt = `Context: นักเรียนสอบสัมภาษณ์ SMTE. Question: "${text}". Task: ตอบสั้นๆ 2 ประโยค มั่นใจ ฉลาด.`;

            try {
                const answer = await fetchAI(prompt);
                aiBox.innerHTML = `<div class="text-3xl md:text-5xl font-bold text-white leading-normal teleprompter-text animate-fade-in px-2">${answer}</div>`;
                document.getElementById('model-status').innerText = "Ready";
            } catch (err) {
                // *** แสดงหน้าจอให้คนใช้งานรู้ว่าต้องเปลี่ยน Key ***
                aiBox.innerHTML = `
                    <div class="text-red-400 text-lg mt-10 border border-red-500 p-4 rounded bg-red-900/50">
                        <b>เกิดข้อผิดพลาด:</b><br>
                        ${err.message}<br><br>
                        <button onclick="openKeyModal()" class="bg-yellow-500 text-black px-4 py-2 rounded font-bold hover:bg-yellow-400">
                            คลิกเพื่อเปลี่ยน API KEY ใหม่
                        </button>
                    </div>`;
            }
        }

        // --- SPEECH & UTILS ---
        function clearScreen() {
            document.getElementById('ai-response-box').innerHTML = '<div class="text-gray-600 text-xl font-light opacity-50 italic mt-20">(รอฟังครูถาม...)</div>';
            document.getElementById('transcript-text').innerText = "...";
        }

        let recognition;
        let isListening = false;
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'th-TH';
            recognition.continuous = false;
            recognition.interimResults = true;
            recognition.onstart = () => {
                isListening = true;
                document.getElementById('mic-btn').classList.add('bg-red-600', 'listening-pulse');
                document.getElementById('transcript-text').innerText = "กำลังฟัง...";
            };
            recognition.onend = () => {
                isListening = false;
                document.getElementById('mic-btn').classList.remove('bg-red-600', 'listening-pulse');
            };
            recognition.onresult = (e) => {
                document.getElementById('transcript-text').innerText = Array.from(e.results).map(r => r[0].transcript).join('');
            };
        }
        function toggleMic() {
            if (!recognition) return alert("Browser ไม่รองรับไมค์");
            try { isListening ? recognition.stop() : recognition.start(); } catch (e) { recognition.stop(); }
        }
    </script>
</body>
</html>
