<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMTE Teleprompter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
        
        /* Animation ตอนฟัง */
        .listening-pulse { animation: pulse-red 1.5s infinite; }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        /* ซ่อน Scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* สไตล์ Teleprompter */
        .teleprompter-text {
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            line-height: 1.4;
        }
    </style>
</head>
<body class="bg-black text-white h-screen flex flex-col overflow-hidden">

    <div id="fake-error-screen" class="hidden fixed inset-0 bg-[#0078d7] z-[100] flex flex-col items-center justify-center text-white font-mono p-10 cursor-none select-none">
        <div class="text-[100px] mb-4">:(</div>
        <h2 class="text-4xl mb-8">Your PC ran into a problem.</h2>
        <div class="text-xl">Stop code: CRITICAL_PROCESS_DIED</div>
    </div>

    <div id="admin-panel" class="hidden absolute inset-0 bg-black/95 z-50 p-6 overflow-y-auto">
        <div class="flex justify-between items-center mb-8 border-b border-gray-700 pb-4">
            <h2 class="text-2xl font-bold text-red-500">CONTROL ROOM</h2>
            <button onclick="document.getElementById('admin-panel').classList.add('hidden')" class="text-gray-400 border border-gray-600 px-4 py-2 rounded">Close</button>
        </div>
        <div id="user-list-container" class="grid grid-cols-1 gap-4"></div>
    </div>

    <div class="flex-1 flex flex-col relative z-10">
        
        <main class="flex-1 flex flex-col justify-start pt-10 px-6 md:px-20 text-center relative">
            <div class="absolute top-2 left-4 text-xs text-gray-600 flex gap-2">
                <span id="status-dot" class="w-2 h-2 rounded-full bg-green-500 mt-1"></span>
                <span id="model-status">System Ready</span>
            </div>

            <div id="ai-response-box" class="flex-1 flex flex-col items-center">
                <div class="text-gray-600 mt-20 text-2xl font-light opacity-50">
                    รอคำถาม... (สายตามองกล้องไว้)
                </div>
            </div>
        </main>

        <footer class="p-6 bg-gray-900 border-t border-gray-800">
            <div id="transcript-text" class="text-xs text-gray-500 text-center mb-4 h-6 truncate italic">...</div>

            <div class="flex items-center justify-center gap-6 max-w-md mx-auto">
                <button id="mic-btn" onclick="toggleMic()" class="w-20 h-20 rounded-full bg-gray-800 border-2 border-gray-600 text-white shadow-lg flex items-center justify-center transition-all active:scale-90 hover:bg-gray-700">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                </button>

                <button onclick="sendToAI()" class="w-20 h-20 rounded-full bg-blue-600 text-white shadow-lg flex items-center justify-center transition-all active:scale-90 hover:bg-blue-500 font-bold text-xl">
                    GO
                </button>
            </div>

            <button onclick="unlockAdmin()" class="absolute bottom-2 right-2 p-2 opacity-10 hover:opacity-100 text-gray-500 text-[10px]">ADMIN</button>
        </footer>
    </div>

    <script>
        // --- 1. CONFIG & API ---
        const GEMINI_API_KEY = "AIzaSyB4TGfiYiZHIdgTeGwyvuDzm5oIHA0wthY";
        let SELECTED_MODEL = "gemini-1.5-flash"; // Default

        // Auto-Detect Model
        async function detectModel() {
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${GEMINI_API_KEY}`);
                const data = await res.json();
                const validModel = data.models.find(m => 
                    m.supportedGenerationMethods.includes("generateContent") && 
                    (m.name.includes("gemini") || m.name.includes("flash"))
                );
                if (validModel) {
                    SELECTED_MODEL = validModel.name.replace("models/", "");
                    document.getElementById('model-status').innerText = "AI: " + SELECTED_MODEL;
                }
            } catch (e) { console.error(e); }
        }
        detectModel();

        const firebaseConfig = {
            apiKey: "AIzaSyDHEHqYCU1dAJLOFPC7TLOa2KucoZG4bxA",
            authDomain: "wolf-game-fdb66.firebaseapp.com",
            databaseURL: "https://wolf-game-fdb66-default-rtdb.firebaseio.com",
            projectId: "wolf-game-fdb66",
            appId: "1:10904255215:web:7a50312897b1e97c77f91a"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // --- 2. IDENTITY ---
        const myID = 'u_' + Math.random().toString(36).substr(2, 4);
        let myStatus = 'normal';
        let recognition;
        
        const ua = navigator.userAgent;
        let dName = ua.includes("Linux") ? "Linux PC" : ua.includes("iPhone") ? "iPhone" : "PC";
        
        const userRef = db.ref('smte_users/' + myID);
        userRef.set({ device: dName, agent: ua, status: 'normal', lastActive: Date.now() });
        userRef.onDisconnect().remove();

        userRef.child('status').on('value', (snap) => {
            myStatus = snap.val() || 'normal';
            if (myStatus === 'troll') {
                document.getElementById('fake-error-screen').classList.remove('hidden');
                if(recognition) try{recognition.stop()}catch(e){};
            } else {
                document.getElementById('fake-error-screen').classList.add('hidden');
            }
        });

        // --- 3. SPEECH ---
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'th-TH';
            recognition.continuous = false;
            recognition.interimResults = true;

            recognition.onstart = () => {
                const btn = document.getElementById('mic-btn');
                btn.classList.add('bg-red-600', 'border-red-500', 'listening-pulse');
                btn.classList.remove('bg-gray-800', 'border-gray-600');
                document.getElementById('transcript-text').innerText = "กำลังฟัง...";
            };
            recognition.onend = () => {
                const btn = document.getElementById('mic-btn');
                btn.classList.remove('bg-red-600', 'border-red-500', 'listening-pulse');
                btn.classList.add('bg-gray-800', 'border-gray-600');
            };
            recognition.onresult = (event) => {
                const transcript = Array.from(event.results).map(r => r[0].transcript).join('');
                document.getElementById('transcript-text').innerText = transcript;
            };
        }

        function toggleMic() {
            if (myStatus === 'troll') return;
            try { recognition.start(); } catch (e) { recognition.stop(); }
        }

        // --- 4. AI LOGIC (Teleprompter Mode) ---
        async function sendToAI() {
            const text = document.getElementById('transcript-text').innerText;
            const aiBox = document.getElementById('ai-response-box');

            if (!text || text === '...' || text.length < 2) return;

            // Loading แบบตัวใหญ่ๆ
            aiBox.innerHTML = `<div class="mt-20 text-4xl font-bold text-yellow-400 animate-pulse">...คิดแป๊บ...</div>`;

            if (myStatus === 'troll') {
                setTimeout(() => {
                    aiBox.innerHTML = '<div class="mt-20 text-6xl font-bold text-red-500">ERROR 404</div>';
                }, 1000);
                return;
            }

            try {
                // Prompt สั่งให้ตอบสั้นๆ แบบบทพูด
                const prompt = `
                Role: คุณคือคนเขียนบทสัมภาษณ์ให้นักเรียน
                Task: เขียน "บทพูดสั้นๆ" 1 ย่อหน้า (ไม่เกิน 2 ประโยค) สำหรับตอบคำถาม: "${text}"
                Requirement: 
                1. ภาษาพูดที่เป็นธรรมชาติ (ครับ/ค่ะ)
                2. ดูฉลาด มั่นใจ แต่ถ่อมตัว
                3. ห้ามมี Option 1, 2, 3 ขออันที่ดีที่สุดอันเดียว
                4. ไม่ต้องเกริ่นนำ เอาเนื้อหาที่จะพูดเลย`;

                const url = `https://generativelanguage.googleapis.com/v1beta/models/${SELECTED_MODEL}:generateContent?key=${GEMINI_API_KEY}`;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const data = await response.json();
                const answer = data.candidates[0].content.parts[0].text;
                
                // แสดงผลแบบตัวใหญ่ๆ (Teleprompter)
                aiBox.innerHTML = `<div class="text-4xl md:text-5xl font-bold text-white leading-tight teleprompter-text animate-fade-in mt-10">${answer}</div>`;

            } catch (err) {
