<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SMTE System Check</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-black text-white h-screen flex flex-col p-4">

    <div class="bg-gray-900 p-4 rounded-xl border border-gray-700 mb-4">
        <h2 class="text-xl font-bold text-yellow-400 mb-2">🔧 โหมดตรวจสอบระบบ</h2>
        <div class="flex gap-2 mb-2">
            <input type="text" id="api-key-input" value="AIzaSyCJ3KpW0Q64QyZefx8CA70VuAFJ1kIkxik" class="flex-1 bg-black border border-gray-600 p-2 rounded text-sm text-gray-300" placeholder="API Key Here">
            <button onclick="testConnection()" class="bg-yellow-600 hover:bg-yellow-500 text-white px-4 py-2 rounded font-bold">TEST SYSTEM</button>
        </div>
        <div id="debug-log" class="text-xs font-mono text-green-400 bg-black p-2 rounded h-24 overflow-y-auto border border-gray-800">
            Click TEST SYSTEM to check...
        </div>
    </div>

    <div id="ai-response-box" class="flex-1 flex items-center justify-center text-center p-4 border border-gray-800 rounded-xl mb-4 bg-gray-900/50">
        <div class="text-gray-500 italic text-xl">(พื้นที่แสดงคำตอบ)</div>
    </div>

    <div class="flex flex-col gap-2">
        <div id="transcript-text" class="text-center text-blue-400 h-6 truncate">...</div>
        <div class="flex justify-center gap-4 pb-4">
            <button id="mic-btn" onclick="toggleMic()" class="w-16 h-16 rounded-full bg-gray-700 border border-gray-500 flex items-center justify-center text-2xl">🎙️</button>
            <button onclick="realAsk()" class="w-16 h-16 rounded-full bg-blue-600 flex items-center justify-center font-bold text-xl">GO</button>
        </div>
    </div>

    <script>
        // --- 1. TEST SYSTEM LOGIC ---
        async function testConnection() {
            const key = document.getElementById('api-key-input').value.trim();
            const log = document.getElementById('debug-log');
            
            log.innerHTML = "1. Checking Network...\n";
            
            // ลองเรียก Model แบบเจาะจง 3 ตัว เพื่อดูว่าตัวไหนรอด
            const models = ["gemini-1.5-flash", "gemini-1.5-pro", "gemini-1.0-pro"];
            
            for (let m of models) {
                log.innerHTML += `2. Trying model: ${m}...\n`;
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${key}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: "Hi" }] }] })
                    });

                    if (res.ok) {
                        const data = await res.json();
                        log.innerHTML += `<span class="text-green-500">✅ SUCCESS! (${m})</span>\n`;
                        log.innerHTML += "ระบบพร้อมใช้งานแล้วครับ!";
                        window.WORKING_MODEL = m; // จำตัวที่ใช้ได้ไว้
                        return; // จบการทำงานเมื่อเจอตัวที่ใช้ได้
                    } else {
                        const errText = await res.text();
                        // แกะ JSON error มาดู
                        let errObj;
                        try { errObj = JSON.parse(errText); } catch(e) { errObj = { error: { message: errText }}; }
                        
                        log.innerHTML += `<span class="text-red-500">❌ Failed (${res.status})</span>: ${errObj.error?.message || errText}\n`;
                    }
                } catch (e) {
                    log.innerHTML += `<span class="text-red-500">❌ Network Error:</span> ${e.message}\n`;
                }
            }
            
            log.innerHTML += "\n<span class="text-red-400 font-bold">สรุป: ใช้ไม่ได้สักโมเดล กรุณาแคปหน้าจอนี้ส่งมาครับ</span>";
        }

        // --- 2. REAL USAGE ---
        window.WORKING_MODEL = "gemini-1.5-flash"; // ค่าเริ่มต้น

        async function realAsk() {
            const text = document.getElementById('transcript-text').innerText;
            const key = document.getElementById('api-key-input').value.trim();
            const box = document.getElementById('ai-response-box');

            if(text.length < 2 || text.includes("...")) return alert("พูดก่อนกด GO ครับ");

            box.innerHTML = "กำลังคิด...";
            
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${window.WORKING_MODEL}:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: "ตอบสั้นๆ 2 บรรทัด สำหรับคำถามสัมภาษณ์: " + text }] }] })
                });
                
                if(!res.ok) throw new Error("API Error");
                const data = await res.json();
                box.innerHTML = `<div class="text-2xl font-bold text-white">${data.candidates[0].content.parts[0].text}</div>`;
                
            } catch(e) {
                box.innerHTML = `<div class="text-red-500">Error. ลองกด TEST SYSTEM ด้านบนดูสาเหตุ</div>`;
            }
        }

        // --- 3. SPEECH ---
        let recognition;
        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.lang = 'th-TH';
            recognition.continuous = false;
            recognition.interimResults = true;
            recognition.onstart = () => document.getElementById('mic-btn').classList.add('bg-red-500');
            recognition.onend = () => document.getElementById('mic-btn').classList.remove('bg-red-500');
            recognition.onresult = (e) => document.getElementById('transcript-text').innerText = e.results[0][0].transcript;
        }
        function toggleMic() { recognition ? recognition.start() : alert("iOS ใช้ Safari นะครับ"); }
    </script>
</body>
</html>
