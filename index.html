<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SMTE Interview Helper</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Sarabun', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
        }
        .listening-pulse { animation: pulse-red 1.5s infinite; }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        .teleprompter-text {
            text-shadow: 0 4px 8px rgba(0,0,0,0.8);
            line-height: 1.4;
            word-break: break-word;
        }
    </style>
</head>
<body class="bg-black text-white h-screen flex flex-col overflow-hidden select-none">

    <div id="init-overlay" class="fixed inset-0 bg-black z-[200] flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500 mb-4"></div>
        <div id="init-status" class="text-blue-400 font-mono text-sm">Connecting AI...</div>
    </div>

    <div class="flex-1 flex flex-col relative z-10 h-full">
        
        <header class="h-12 flex justify-between items-center px-4 bg-black/50 backdrop-blur-sm z-30 fixed top-0 w-full">
            <div class="text-xs text-gray-500 flex gap-2 items-center">
                <span id="status-dot" class="w-2 h-2 rounded-full bg-yellow-500"></span>
                <span id="model-status">Detecting...</span>
            </div>
            <button onclick="clearScreen()" class="text-gray-400 text-xs border border-gray-700 px-3 py-1 rounded hover:bg-gray-800">Clear</button> 
        </header>

        <main class="h-[65vh] flex flex-col items-center justify-start pt-16 px-6 overflow-y-auto no-scrollbar relative w-full">
            <div id="ai-response-box" class="w-full text-center pb-10">
                <div class="text-gray-600 text-xl font-light opacity-50 italic mt-20">
                    (พร้อมแล้ว... รอฟังครูถาม)
                </div>
            </div>
        </main>

        <footer class="h-[35vh] bg-gradient-to-t from-gray-900 via-gray-900 to-transparent flex flex-col justify-end pb-8 fixed bottom-0 w-full z-50">
            
            <div id="transcript-text" class="text-sm text-blue-400 text-center mb-4 h-6 px-4 truncate font-mono">...</div>

            <div class="flex items-center justify-center gap-6">
                <button id="mic-btn" onclick="toggleMic()" class="w-20 h-20 rounded-full bg-gray-800 border-2 border-gray-600 text-white shadow-lg flex items-center justify-center transition-all active:scale-90 hover:bg-gray-700">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                </button>

                <button onclick="sendToAI()" class="w-20 h-20 rounded-full bg-blue-600 text-white shadow-lg flex items-center justify-center transition-all active:scale-90 hover:bg-blue-500 font-bold text-xl">
                    GO
                </button>
            </div>
            <div class="text-[10px] text-gray-600 text-center mt-2">SMTE Mode: Ready</div>
        </footer>
    </div>

    <script>
        // --- 1. API KEY (ใส่ให้แล้ว ห้ามลบ!) ---
        const GEMINI_API_KEY = "AIzaSyCJ3KpW0Q64QyZefx8CA70VuAFJ1kIkxik"; 
        
        let DETECTED_MODEL = ""; 

        // --- 2. FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyDHEHqYCU1dAJLOFPC7TLOa2KucoZG4bxA",
            authDomain: "wolf-game-fdb66.firebaseapp.com",
            databaseURL: "https://wolf-game-fdb66-default-rtdb.firebaseio.com",
            projectId: "wolf-game-fdb66",
            appId: "1:10904255215:web:7a50312897b1e97c77f91a"
        };
        try { if (!firebase.apps.length) firebase.initializeApp(firebaseConfig); } catch(e) {}
        
        // --- 3. AUTO-START ---
        async function initializeAI() {
            try {
                // เช็คว่า Key ใช้ได้ไหม และหา Model ให้เอง
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${GEMINI_API_KEY}`);
                if (!res.ok) throw new Error("API Key Error");
                
                const data = await res.json();
                const validModel = data.models.find(m => m.supportedGenerationMethods.includes("generateContent") && m.name.includes("gemini"));
                
                if (validModel) {
                    DETECTED_MODEL = validModel.name.replace("models/", "");
                    document.getElementById('model-status').innerText = "Online";
                    document.getElementById('status-dot').className = "w-2 h-2 rounded-full bg-green-500";
                    document.getElementById('init-overlay').classList.add('hidden');
                }
            } catch (err) {
                document.getElementById('init-status').innerHTML = "Error: Key อาจผิด หรือเน็ตหลุด<br><br>ให้รีเฟรชหน้าจอใหม่";
            }
        }
        initializeAI();

        // --- 4. SPEECH ---
        let recognition;
        let isListening = false;
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'th-TH';
            recognition.continuous = false;
            recognition.interimResults = true;
            recognition.onstart = () => {
                isListening = true;
                document.getElementById('mic-btn').classList.add('bg-red-600', 'listening-pulse');
                document.getElementById('transcript-text').innerText = "กำลังฟัง...";
            };
            recognition.onend = () => {
                isListening = false;
                document.getElementById('mic-btn').classList.remove('bg-red-600', 'listening-pulse');
            };
            recognition.onresult = (e) => {
                document.getElementById('transcript-text').innerText = Array.from(e.results).map(r => r[0].transcript).join('');
            };
        }

        function toggleMic() {
            if (!recognition) return;
            try { isListening ? recognition.stop() : recognition.start(); } catch (e) { recognition.stop(); }
        }

        // --- 5. AI LOGIC (SMTE Tuned) ---
        async function sendToAI() {
            const text = document.getElementById('transcript-text').innerText;
            const aiBox = document.getElementById('ai-response-box');

            if (!text || text.length < 2 || text.includes('กำลังฟัง')) return;
            if (!DETECTED_MODEL) return; // ถ้ายังไม่พร้อม ไม่ต้องทำอะไร

            // Loading
            aiBox.innerHTML = `<div class="mt-10 text-3xl font-bold text-yellow-400 animate-pulse">...คิดคำตอบ...</div>`;

            // Prompt สั่งให้ตอบสั้นๆ แบบเด็กฉลาด
            const prompt = `
            Context: ฉันเป็นนักเรียน ม.ปลาย สอบสัมภาษณ์เข้าห้องเรียนพิเศษวิทย์-คณิต (SMTE)
            Question: ครูถามว่า "${text}"
            Task: เขียนคำตอบสั้นๆ ให้ฉันพูดตอบครูเดี๋ยวนี้ (ห้ามยาว!)
            Rules:
            1. ตอบสั้นกระชับ (ไม่เกิน 2 ประโยค) เน้นเนื้อๆ
            2. ถ้าให้เลือก ให้ฟันธงมา 1 อย่างที่ดูฉลาด
            3. น้ำเสียงมั่นใจ สุภาพ (ลงท้าย ครับ/ค่ะ)
            4. แสดงความมุ่งมั่นด้านวิทย์/เทคโนโลยี`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${DETECTED_MODEL}:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const data = await response.json();
                const answer = data.candidates[0].content.parts[0].text;
                
                // แสดงผล (ตัวใหญ่ อ่านง่าย)
                aiBox.innerHTML = `<div class="text-3xl md:text-5xl font-bold text-white leading-normal teleprompter-text animate-fade-in px-2">${answer}</div>`;

            } catch (err) {
                // ถ้า Error ให้รีเซ็ตเบาๆ ไม่ต้องขึ้นหน้าแดงบังจอ
                aiBox.innerHTML = `<div class="text-red-400 text-xl mt-10">เน็ตมีปัญหา ลองกด GO ใหม่</div>`;
            }
        }

        function clearScreen() {
            document.getElementById('ai-response-box').innerHTML = '<div class="text-gray-600 text-xl font-light opacity-50 italic mt-20">(รอฟังครูถาม...)</div>';
            document.getElementById('transcript-text').innerText = "...";
        }
    </script>
</body>
</html>
