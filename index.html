<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SMTE iPad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; touch-action: manipulation; }
        .teleprompter-text { text-shadow: 0 2px 4px rgba(0,0,0,0.8); line-height: 1.3; }
        
        /* ปุ่มเลือกโหมด (ใหญ่ขึ้นสำหรับ iPad) */
        .tone-btn {
            background-color: #1f2937; color: #9ca3af; border: 1px solid #374151;
            transition: all 0.2s;
        }
        .tone-btn.active {
            background-color: #2563eb; color: white; border-color: #60a5fa;
            transform: scale(1.05); box-shadow: 0 0 10px rgba(37, 99, 235, 0.5);
        }
        
        /* Animation ไมค์ */
        .mic-active {
            background-color: #dc2626 !important; border-color: #ef4444 !important;
            animation: pulse-red 1.5s infinite;
        }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(220, 38, 38, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
        }
    </style>
</head>
<body class="bg-black text-white h-screen flex flex-col overflow-hidden">

    <div id="main-ui" class="flex-1 flex flex-col relative z-10">
        
        <main class="flex-1 flex flex-col justify-start pt-8 px-4 text-center relative">
            
            <div class="flex justify-center gap-2 mb-4 flex-wrap">
                <button onclick="setTone('formal')" id="btn-formal" class="tone-btn px-4 py-3 rounded-xl text-sm font-bold">ทางการ</button>
                <button onclick="setTone('semi')" id="btn-semi" class="tone-btn px-4 py-3 rounded-xl text-sm font-bold active">กึ่งทางการ</button>
                <button onclick="setTone('simple')" id="btn-simple" class="tone-btn px-4 py-3 rounded-xl text-sm font-bold">ง่ายๆ</button>
            </div>

            <div class="text-[10px] text-gray-500 mb-2">System Ready (Gemini Pro)</div>

            <div id="ai-response-box" class="flex-1 flex flex-col items-center overflow-y-auto pb-24">
                <div class="text-gray-700 mt-20 text-2xl font-light opacity-30 select-none">
                    (แตะไมค์ แล้วพูด...)
                </div>
            </div>
        </main>

        <footer class="p-6 bg-gray-950 border-t border-gray-900 absolute bottom-0 w-full pb-10">
            <div id="transcript-text" class="text-xs text-gray-400 text-center mb-4 h-5 truncate italic">...</div>
            
            <div class="flex items-center justify-center gap-6">
                <button id="mic-btn" onclick="toggleMic()" class="w-20 h-20 rounded-full bg-gray-800 border-2 border-gray-600 text-white flex items-center justify-center transition-all active:scale-95 shadow-lg">
                    <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                </button>

                <button onclick="sendToAI()" class="w-24 h-24 rounded-3xl bg-blue-600 text-white shadow-lg shadow-blue-900/30 flex items-center justify-center transition-all active:scale-95 hover:bg-blue-500 font-bold text-3xl">
                    GO
                </button>
            </div>
        </footer>
    </div>

    <div id="admin-panel" class="hidden absolute inset-0 bg-gray-900 z-50 p-6 overflow-y-auto">
        <header class="flex justify-between items-center mb-6 border-b border-gray-700 pb-4">
            <h2 class="text-2xl font-bold text-red-500">CONTROL ROOM</h2>
            <button onclick="window.location.reload()" class="text-gray-400 border border-gray-600 px-4 py-2 rounded text-xs">Exit</button>
        </header>
        <div id="user-list-container" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>

    <div id="fake-error-screen" class="hidden fixed inset-0 bg-[#0078d7] z-[100] flex flex-col items-center justify-center text-white font-mono p-10 cursor-none select-none">
        <div class="text-[80px] mb-4">:(</div>
        <h2 class="text-3xl mb-4">Error</h2>
    </div>

    <script>
        // --- 1. SETTINGS ---
        const GEMINI_API_KEY = "AIzaSyB4TGfiYiZHIdgTeGwyvuDzm5oIHA0wthY";
        const MODEL_NAME = "gemini-pro"; 

        let currentTone = 'semi';
        let recognition;
        let isRecording = false;

        const tones = {
            'formal': 'ทางการ วิชาการ สุภาพมาก',
            'semi': 'กึ่งทางการ สุภาพแต่มั่นใจ (แนะนำ)',
            'simple': 'ภาษาพูด ง่ายๆ สั้นๆ กระชับ',
        };

        function setTone(mode) {
            currentTone = mode;
            document.querySelectorAll('.tone-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + mode).classList.add('active');
        }

        // --- 2. FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyDHEHqYCU1dAJLOFPC7TLOa2KucoZG4bxA",
            authDomain: "wolf-game-fdb66.firebaseapp.com",
            databaseURL: "https://wolf-game-fdb66-default-rtdb.firebaseio.com",
            projectId: "wolf-game-fdb66",
            appId: "1:10904255215:web:7a50312897b1e97c77f91a"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // --- 3. IDENTITY ---
        const myID = 'u_' + Math.random().toString(36).substr(2, 4);
        const ua = navigator.userAgent;
        let dName = ua.includes("iPad") ? "iPad" : ua.includes("iPhone") ? "iPhone" : "Mobile";
        
        const userRef = db.ref('smte_users/' + myID);
        userRef.set({ device: dName, agent: ua, status: 'normal', lastActive: Date.now() });
        userRef.onDisconnect().remove();

        userRef.child('status').on('value', (snap) => {
            if ((snap.val() || 'normal') === 'troll') {
                document.getElementById('fake-error-screen').classList.remove('hidden');
            } else {
                document.getElementById('fake-error-screen').classList.add('hidden');
            }
        });

        // --- 4. MIC (iPad Compatible) ---
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'th-TH';
            recognition.continuous = false;
            recognition.interimResults = true;

            recognition.onstart = () => {
                isRecording = true;
                document.getElementById('mic-btn').classList.add('mic-active');
                document.getElementById('transcript-text').innerText = "กำลังฟัง...";
            };
            recognition.onend = () => {
                isRecording = false;
                document.getElementById('mic-btn').classList.remove('mic-active');
            };
            recognition.onresult = (event) => {
                const transcript = Array.from(event.results).map(r => r[0].transcript).join('');
                document.getElementById('transcript-text').innerText = transcript;
            };
        } else {
            alert("⚠️ iPad กรุณาใช้ Safari เท่านั้น (Chrome อาจบล็อกไมค์)");
        }

        function toggleMic() {
            if (isRecording) {
                recognition.stop();
            } else {
                try { recognition.start(); } catch (e) { alert("Mic Error: กด Allow หรือยัง?"); }
            }
        }

        // --- 5. AI LOGIC ---
        async function sendToAI() {
            const text = document.getElementById('transcript-text').innerText;
            const aiBox = document.getElementById('ai-response-box');

            if (!text || text === '...' || text.length < 2) {
                alert("พูดคำถามก่อนครับ!");
                return;
            }

            aiBox.innerHTML = `<div class="mt-20 text-4xl font-bold text-yellow-500 animate-pulse tracking-widest">...กำลังคิด...</div>`;

            try {
                const prompt = `
                Role: คนเขียนบทสัมภาษณ์ SMTE
                Tone: ${tones[currentTone]}
                Question: "${text}"
                Task: เขียนคำตอบ 1 ย่อหน้าสั้นๆ (ไม่เกิน 2 ประโยค) อ่านตามได้เลย`;

                const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${GEMINI_API_KEY}`;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                if (!response.ok) throw new Error("API Error");

                const data = await response.json();
                const answer = data.candidates[0].content.parts[0].text;
                aiBox.innerHTML = `<div class="text-4xl font-bold text-white leading-snug teleprompter-text animate-fade-in mt-10 px-4">${answer}</div>`;

            } catch (err) {
                aiBox.innerHTML = `<div class="text-lg text-red-400 mt-20">Error: เช็คเน็ต/Key</div>`;
            }
        }
    </script>
</body>
</html>
