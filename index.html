<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SMTE Teleprompter (iPad Optimized)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Sarabun', sans-serif; 
            -webkit-tap-highlight-color: transparent; /* ลบสีฟ้าตอนกดบน iPad */
        }
        
        .listening-pulse { animation: pulse-red 1.5s infinite; }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        .teleprompter-text {
            text-shadow: 0 4px 8px rgba(0,0,0,0.8);
            line-height: 1.5;
            word-break: break-word;
        }

        /* รองรับติ่งหน้าจอ iPad/iPhone */
        .safe-pb { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="bg-black text-white h-screen flex flex-col overflow-hidden select-none">

    <div id="fake-error-screen" class="hidden fixed inset-0 bg-[#0078d7] z-[100] flex flex-col items-center justify-center text-white font-mono p-10">
        <div class="text-[80px] mb-4">:(</div>
        <h2 class="text-2xl md:text-4xl mb-8 text-center">Your Device ran into a problem.</h2>
        <div class="text-lg opacity-80">Stop code: CRITICAL_PROCESS_DIED</div>
    </div>

    <div class="flex-1 flex flex-col relative z-10">
        <header class="p-4 flex justify-between items-center">
            <div class="flex gap-2 items-center">
                <span id="status-dot" class="w-3 h-3 rounded-full bg-green-500"></span>
                <span id="model-status" class="text-xs text-gray-500 font-mono uppercase tracking-widest">System Ready</span>
            </div>
            <button onclick="unlockAdmin()" class="text-gray-800 text-[10px]">ADMIN</button>
        </header>
        
        <main class="flex-1 flex flex-col justify-center px-8 md:px-24 text-center">
            <div id="ai-response-box" class="flex flex-col items-center">
                <div id="placeholder-text" class="text-gray-700 text-3xl font-light italic">
                    แตะไมโครโฟนแล้วเริ่มพูด...
                </div>
            </div>
        </main>

        <footer class="p-8 bg-zinc-900/50 backdrop-blur-md border-t border-white/5 safe-pb">
            <div id="transcript-text" class="text-sm text-blue-400 text-center mb-6 h-6 truncate font-medium">รอรับเสียง...</div>

            <div class="flex items-center justify-center gap-8 max-w-md mx-auto">
                <button id="mic-btn" onclick="toggleMic()" class="w-24 h-24 rounded-full bg-zinc-800 border-4 border-zinc-700 text-white shadow-2xl flex items-center justify-center transition-all active:scale-95">
                    <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                </button>

                <button id="send-btn" onclick="sendToAI()" class="w-24 h-24 rounded-full bg-blue-600 text-white shadow-2xl flex items-center justify-center transition-all active:scale-95 font-black text-2xl">
                    GO
                </button>
            </div>
        </footer>
    </div>

    <script>
        // --- CONFIG ---
        const GEMINI_API_KEY = "AIzaSyB4TGfiYiZHIdgTeGwyvuDzm5oIHA0wthY";
        let SELECTED_MODEL = "gemini-1.5-flash"; 

        // --- FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyDHEHqYCU1dAJLOFPC7TLOa2KucoZG4bxA",
            authDomain: "wolf-game-fdb66.firebaseapp.com",
            databaseURL: "https://wolf-game-fdb66-default-rtdb.firebaseio.com",
            projectId: "wolf-game-fdb66",
            appId: "1:10904255215:web:7a50312897b1e97c77f91a"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const myID = 'iPad_' + Math.random().toString(36).substr(2, 4);
        const userRef = db.ref('smte_users/' + myID);

        userRef.set({ device: "iPad", lastActive: Date.now(), status: 'normal' });
        userRef.onDisconnect().remove();

        // --- SPEECH RECOGNITION (iOS FIX) ---
        let recognition;
        let isListening = false;
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'th-TH';
            recognition.continuous = false;
            recognition.interimResults = true;

            recognition.onstart = () => {
                isListening = true;
                const btn = document.getElementById('mic-btn');
                btn.classList.add('bg-red-600', 'border-red-400', 'listening-pulse');
                document.getElementById('transcript-text').innerText = "กำลังฟัง...";
            };

            recognition.onend = () => {
                isListening = false;
                const btn = document.getElementById('mic-btn');
                btn.classList.remove('bg-red-600', 'border-red-400', 'listening-pulse');
            };

            recognition.onresult = (event) => {
                const transcript = Array.from(event.results).map(r => r[0].transcript).join('');
                document.getElementById('transcript-text').innerText = transcript;
            };

            recognition.onerror = (e) => {
                console.error("Speech Error:", e.error);
                if(e.error === 'not-allowed') alert("กรุณาอนุญาตให้เข้าถึงไมโครโฟนในการตั้งค่า Safari");
            };
        }

        function toggleMic() {
            if (!recognition) return alert("เบราว์เซอร์นี้ไม่รองรับการสั่งงานด้วยเสียง");
            if (isListening) {
                recognition.stop();
            } else {
                // iOS ต้องการการเรียก .start() ภายใต้ click event โดยตรง
                recognition.start();
            }
        }

        // --- AI LOGIC ---
        async function sendToAI() {
            const transcriptElement = document.getElementById('transcript-text');
            const text = transcriptElement.innerText;
            const aiBox = document.getElementById('ai-response-box');

            if (!text || text === 'รอรับเสียง...' || text === 'กำลังฟัง...') return;

            aiBox.innerHTML = `<div class="text-3xl font-bold text-blue-400 animate-pulse">กำลังประมวลผลบทพูด...</div>`;

            try {
                const prompt = `เขียนบทพูดสั้นๆ 1 ย่อหน้า สำหรับตอบคำถาม: "${text}" เน้นภาษาพูดธรรมชาติ มั่นใจ ถ่อมตัว ไม่ต้องมีเกริ่นนำ เอาเนื้อหาที่จะพูดเลย (ภาษาไทย)`;
                
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${SELECTED_MODEL}:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const data = await response.json();
                const answer = data.candidates[0].content.parts[0].text;
                
                aiBox.innerHTML = `<div class="text-4xl md:text-6xl font-extrabold text-white teleprompter-text">${answer}</div>`;
                transcriptElement.innerText = "ส่งคำถามแล้ว";

            } catch (err) {
                aiBox.innerHTML = `<div class="text-red-500 text-xl">เกิดข้อผิดพลาดในการเชื่อมต่อ AI</div>`;
            }
        }

        function unlockAdmin() {
            const pass = prompt("Enter Admin Pass:");
            if(pass === "1234") {
                // เพิ่ม Logic เปิด Panel ตรงนี้ถ้าต้องการ
                alert("Welcome Admin");
            }
        }
    </script>
</body>
</html>
