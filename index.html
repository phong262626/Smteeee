<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SMTE Teleprompter (Final Fix)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Sarabun', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none; /* ห้ามดึงขอบจอ */
        }
        
        .listening-pulse { animation: pulse-red 1.5s infinite; }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* จัด Text ให้เหมาะกับการอ่านบท */
        .teleprompter-text {
            text-shadow: 0 4px 8px rgba(0,0,0,0.8);
            line-height: 1.6;
            word-break: break-word;
        }
    </style>
</head>
<body class="bg-black text-white h-screen flex flex-col overflow-hidden select-none">

    <div id="fake-error-screen" class="hidden fixed inset-0 bg-[#0078d7] z-[100] flex flex-col items-center justify-center text-white font-mono p-10 cursor-none select-none">
        <div class="text-[80px] mb-4">:(</div>
        <h2 class="text-3xl mb-8 text-center">Your Device ran into a problem.</h2>
        <div class="text-xl opacity-80">Stop code: CRITICAL_PROCESS_DIED</div>
    </div>

    <div id="admin-panel" class="hidden absolute inset-0 bg-black/95 z-50 p-6 overflow-y-auto safe-area-inset-top">
        <div class="flex justify-between items-center mb-8 border-b border-gray-700 pb-4 mt-8">
            <h2 class="text-2xl font-bold text-red-500">CONTROL ROOM</h2>
            <button onclick="document.getElementById('admin-panel').classList.add('hidden')" class="text-gray-400 border border-gray-600 px-4 py-2 rounded">Close</button>
        </div>
        <div id="user-list-container" class="grid grid-cols-1 gap-4"></div>
    </div>

    <div class="flex-1 flex flex-col relative z-10">
        
        <header class="absolute top-4 left-6 right-6 flex justify-between z-20">
            <div class="text-xs text-gray-500 flex gap-2 items-center bg-black/30 px-3 py-1 rounded-full backdrop-blur-sm">
                <span id="status-dot" class="w-2 h-2 rounded-full bg-green-500"></span>
                <span id="model-status">System Ready</span>
            </div>
            <button onclick="unlockAdmin()" class="opacity-0 w-10 h-10">.</button> 
        </header>

        <main class="flex-1 flex flex-col justify-center pt-10 px-6 md:px-20 text-center relative overflow-y-auto no-scrollbar">
            <div id="ai-response-box" class="flex flex-col items-center justify-center min-h-[50vh]">
                <div class="text-gray-600 text-2xl font-light opacity-50 italic">
                    (แตะไมโครโฟนเพื่อเริ่มพูด)
                </div>
            </div>
        </main>

        <footer class="p-6 pb-12 bg-gradient-to-t from-black via-black/90 to-transparent">
            <div id="transcript-text" class="text-sm text-blue-400 text-center mb-4 h-6 truncate font-mono">...</div>

            <div class="flex items-center justify-center gap-8 max-w-md mx-auto">
                <button id="mic-btn" onclick="toggleMic()" class="w-20 h-20 rounded-full bg-gray-800 border-2 border-gray-600 text-white shadow-lg flex items-center justify-center transition-all active:scale-90 hover:bg-gray-700">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                </button>

                <button onclick="sendToAI()" class="w-20 h-20 rounded-full bg-blue-600 text-white shadow-lg flex items-center justify-center transition-all active:scale-90 hover:bg-blue-500 font-bold text-xl">
                    GO
                </button>
            </div>
        </footer>
    </div>

    <script>
        // --- 1. API KEY (ของคุณ) ---
        const GEMINI_API_KEY = "AIzaSyCYhxF5-FQRrwJQ5iSeokdG6BMtsyzHULE";
        
        // --- 2. FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyDHEHqYCU1dAJLOFPC7TLOa2KucoZG4bxA",
            authDomain: "wolf-game-fdb66.firebaseapp.com",
            databaseURL: "https://wolf-game-fdb66-default-rtdb.firebaseio.com",
            projectId: "wolf-game-fdb66",
            appId: "1:10904255215:web:7a50312897b1e97c77f91a"
        };
        try { if (!firebase.apps.length) firebase.initializeApp(firebaseConfig); } catch(e) {}
        const db = firebase.database();

        // --- 3. IDENTITY ---
        const ua = navigator.userAgent;
        const isIPad = ua.includes("iPad") || (ua.includes("Macintosh") && "ontouchend" in document);
        const myID = (isIPad ? 'iPad_' : 'u_') + Math.random().toString(36).substr(2, 4);
        
        const userRef = db.ref('smte_users/' + myID);
        userRef.set({ device: isIPad ? "iPad" : "Device", status: 'normal', lastActive: Date.now() });
        userRef.onDisconnect().remove();

        userRef.child('status').on('value', (s) => {
            if (s.val() === 'troll') document.getElementById('fake-error-screen').classList.remove('hidden');
            else document.getElementById('fake-error-screen').classList.add('hidden');
        });

        // --- 4. SPEECH (Fix for iPad) ---
        let recognition;
        let isListening = false;
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'th-TH';
            recognition.continuous = false; 
            recognition.interimResults = true;

            recognition.onstart = () => {
                isListening = true;
                const btn = document.getElementById('mic-btn');
                btn.classList.add('bg-red-600', 'listening-pulse');
                document.getElementById('transcript-text').innerText = "กำลังฟัง...";
            };
            recognition.onend = () => {
                isListening = false;
                document.getElementById('mic-btn').classList.remove('bg-red-600', 'listening-pulse');
            };
            recognition.onresult = (e) => {
                document.getElementById('transcript-text').innerText = Array.from(e.results).map(r => r[0].transcript).join('');
            };
        } else {
            alert("อุปกรณ์นี้ไม่รองรับการฟังเสียง");
        }

        function toggleMic() {
            if (!recognition) return;
            try { isListening ? recognition.stop() : recognition.start(); } catch (e) { recognition.stop(); }
        }

        // --- 5. AI LOGIC (ระบบแก้ 404 อัตโนมัติ) ---
        
        // ฟังก์ชั่นยิง API แยกออกมาเพื่อให้เรียกซ้ำได้
        async function fetchGemini(prompt, modelName) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${GEMINI_API_KEY}`;
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    contents: [{ parts: [{ text: prompt }] }] 
                })
            });
            
            if (!response.ok) {
                // ถ้าเจอ 404 ให้โยน Error กลับไปเพื่อให้ฟังก์ชั่นหลักเปลี่ยนโมเดล
                throw new Error(response.status); 
            }
            return await response.json();
        }

        async function sendToAI() {
            const text = document.getElementById('transcript-text').innerText;
            const aiBox = document.getElementById('ai-response-box');
            const statusLabel = document.getElementById('model-status');

            if (!text || text.length < 2 || text.includes('กำลังฟัง')) return;

            aiBox.innerHTML = `<div class="mt-10 text-4xl font-bold text-yellow-400 animate-pulse text-center">...กำลังคิดคำตอบ...</div>`;

            // Prompt ที่สั่งให้ AI ตอบ
            const prompt = `Role: คุณคือโค้ชสัมภาษณ์งานอัจฉริยะ. Task: เขียนบทพูดสั้นๆให้ฉันตอบคำถามนี้: "${text}". Requirement: ตอบสั้นๆ (2-3 ประโยค), มั่นใจ, เป็นธรรมชาติ, ไม่ต้องเกริ่นนำ`;

            try {
                // 1. ลองใช้โมเดลรุ่นใหม่ก่อน (เร็วสุด)
                statusLabel.innerText = "Trying: Flash...";
                let data = null;
                
                try {
                    data = await fetchGemini(prompt, "gemini-1.5-flash");
                } catch (e) {
                    if (e.message == "404") {
                        // 2. ถ้าพัง (404) ให้สลับไปใช้ตัว Pro (เสถียรสุด)
                        statusLabel.innerText = "Switching to Pro...";
                        console.warn("Flash model failed (404), switching to Pro.");
                        data = await fetchGemini(prompt, "gemini-pro");
                    } else {
                        throw e; // ถ้าเป็น error อื่นที่ไม่ใช่ 404 ให้โยนทิ้งเลย
                    }
                }

                // แสดงผล
                const answer = data.candidates[0].content.parts[0].text;
                aiBox.innerHTML = `<div class="text-4xl md:text-5xl font-bold text-white leading-snug teleprompter-text animate-fade-in mt-6 px-4">${answer}</div>`;
                statusLabel.innerText = "System Ready";

            } catch (err) {
                console.error(err);
                aiBox.innerHTML = `
                    <div class="mt-10 text-red-400 text-lg text-center border p-4 border-red-500 rounded bg-red-900/50">
                        <b>ยังคงเกิดข้อผิดพลาด:</b> ${err.message}<br>
                        (ลองกด GO ใหม่อีกครั้ง)
                    </div>`;
            }
        }

        // --- 6. ADMIN ---
        function unlockAdmin() {
            if (prompt("Pass:") === "1234") {
                document.getElementById('admin-panel').classList.remove('hidden');
                loadUsers();
            }
        }
        function loadUsers() {
            const container = document.getElementById('user-list-container');
            db.ref('smte_users').on('value', (snap) => {
                container.innerHTML = '';
                snap.forEach((child) => {
                    const u = child.val();
                    const btnClass = u.status === 'troll' ? 'bg-green-600' : 'bg-red-600';
                    const label = u.status === 'troll' ? 'Restore' : 'Kill';
                    container.innerHTML += `
                        <div class="p-4 rounded border border-gray-700 bg-gray-800 flex justify-between items-center mb-2">
                            <div>${u.device}</div>
                            <button onclick="db.ref('smte_users/${child.key}/status').set('${u.status==='troll'?'normal':'troll'}')" class="px-3 py-1 rounded ${btnClass} text-white">${label}</button>
                        </div>`;
                });
            });
        }
    </script>
</body>
</html>
